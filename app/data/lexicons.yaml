    S3: [this is a confidential investigation, you cannot tell anyone, do not inform anyone]
    S4: [you must act now, before the deadline, in the next one hour]
    S5: [move your money, verify your funds, install the app, share the code, pay the fine]
    negations: [never, "don't", not, dont]
    clause_breaks: [otherwise, or else]

