# Scam kill-chain lexicon.
#   S1 authority, S2 fear, S3 isolation, S4 urgency, S5 extraction
# Every list is matched against every transcript, whatever language was detected
# (Hindi and Marathi share Devanagari and are often tagged as each other).
# Latin entries match whole words, case-insensitive. Native-script entries match
# as substrings because Indic words take suffixes.
# Negations only guard S5: "never share your OTP" must not count as extraction.
# Negations are single words matched as whole tokens; a leading ~ means a suffix
# (Dravidian negative imperatives: ಹೇಳಬೇಡಿ, చెప్పకండి, சொல்லாதீர்கள்).
# clause_breaks end a clause, so "OTP batao warna arrest nahi rukega" keeps its S5.

shared:  # Latin loanwords; Prisma `format=codemix` keeps these in Latin in every language
  S1: [cbi, police, trai, customs, fedex, enforcement directorate, rbi, reserve bank,
       cyber cell, cyber crime, crime branch, narcotics, ncb, income tax department,
       judge, court, inspector, ips officer, dcp, interpol, mumbai police, delhi police]
  S2: [arrest, arrested, digital arrest, warrant, arrest warrant, criminal case, case registered,
       case file, case darj, case hai, fir, money laundering, drugs, seized, illegal items, jail,
       hawala, terror funding, legal action, accident, account blocked, account will be blocked,
       sim will be blocked, number will be blocked, suspended, deactivated]
  S3: [don't tell anyone, do not tell anyone, dont tell anyone, don't tell your family,
       don't cut the call, do not cut the call, don't disconnect, do not disconnect,
       stay on video call, stay on the call, keep your camera on, skype, confidential matter,
       kisi ko mat batana, kisi ko mat bataiye, kisi ko nahi batana, phone mat kaatna,
       call mat kaatna, family ko mat batana, ghar walon ko mat batana]
  S4: [right now, immediately, within 2 hours, within two hours, within 24 hours, today itself,
       otherwise, urgent, urgently, last chance, turant, abhi ke abhi, aaj hi, warna, jaldi karo]
  S5: [transfer, safe account, secure account, rbi account, verification amount, verification fee,
       verification charge, otp, upi, upi pin, anydesk, any desk, teamviewer, team viewer,
       quicksupport, screen share, aadhaar number, aadhar number, bank details, account number,
       card number, cvv, atm pin, send money, rtgs, neft, imps, gift card, kyc link, paise bhejo,
       paisa bhejo, paise transfer]
  negations: [mat, nahi, nahin, never, "don't", dont, not]
  clause_breaks: [warna, otherwise, nahi to, varna]

