# Builds a signed APK and publishes it as a GitHub Release whenever the Android app changes on main.
# Stable download link: https://github.com/buildwithsoumya/saavdhaan/releases/latest/download/saavdhaan.apk
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch: # "Run workflow" button on the Actions tab

permissions:
  contents: write # create releases

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' # "Run workflow" accepts any branch; only main may publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing (see README: Android app releases)"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed APK
        working-directory: android
        env:
          SAAVDHAAN_KEYSTORE: ${{ runner.temp }}/release.jks
          SAAVDHAAN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SAAVDHAAN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SAAVDHAAN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="0.1.${GITHUB_RUN_NUMBER}"
          # app-release.apk only exists when signing worked; an unsigned build fails here
          cp android/app/build/outputs/apk/release/app-release.apk saavdhaan.apk
          {
            echo "Saavdhaan listener app for Android 10+."
            echo
            echo "Install: download **saavdhaan.apk** on the phone and open it (allow installing from this source)."
            echo "Updates install over the previous version and keep its settings."
            echo
            echo "Built from $(git log -1 --format='%h: %s')"
          } > notes.md
          tag="android-v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then # a re-run keeps the run number: replace the asset
            gh release upload "$tag" saavdhaan.apk --clobber
          else
            gh release create "$tag" saavdhaan.apk \
              --target "$GITHUB_SHA" \
              --title "Saavdhaan Android ${version}" \
              --notes-file notes.md \
              --latest
          fi
