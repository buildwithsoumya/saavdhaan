  text: ठीक है साहब, बताइए क्या करना है।
- speaker: caller
  text: जाँच के लिए अपने सारे पैसे तुरंत आरबीआई के सेफ अकाउंट में ट्रांसफर कीजिए, दो घंटे में, वरना गिरफ्तारी होगी।
