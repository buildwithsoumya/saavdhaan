  text: ठीक है।
- speaker: caller
  text: Judge साहब का order है कि जाँच पूरी होने तक आपकी सारी जमा राशि सरकारी खाते में रहेगी।
- speaker: caller
  text: आज ही RTGS से पैसे transfer कीजिए, यह last chance है।
- speaker: victim
  text: मेरे पास इतने पैसे नहीं हैं।
